    <path d="M79.5 31.5 C77.2 29.2 73.5 29.2 71.2 31.5 L36.8 65.9 C34.5 68.2 34.5 71.9 36.8 74.2 L71.2 108.6 C73.5 110.9 77.2 110.9 79.5 108.6 C81.8 106.3 81.8 102.6 79.5 100.3 L49.2 70.1 L79.5 39.8 C81.8 37.5 81.8 33.8 79.5 31.5 Z" fill="#909090"/>
    <!-- Yellow top slash -->
    <path d="M57.6 57.5 C54.3 54.2 54.3 48.9 57.6 45.6 L76.8 26.4 C80.1 23.1 85.4 23.1 88.7 26.4 C92 29.7 92 35 88.7 38.3 L69.5 57.5 C66.2 60.8 60.9 60.8 57.6 57.5 Z" fill="url(#lcYellow)"/>
    <!-- Yellow horizontal bar -->
    <path d="M52 70 H98 C102.4 70 106 66.4 106 62 C106 57.6 102.4 54 98 54 H52 C47.6 54 44 57.6 44 62 C44 66.4 47.6 70 52 70 Z" fill="url(#lcYellow)"/>
