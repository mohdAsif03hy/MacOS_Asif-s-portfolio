<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Warm Solar Wave -->
    <linearGradient id="amberWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.65" />
    </linearGradient>

    <!-- Soft Cyan Sunlight Ribbon -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Azure Depth Ribbon -->
    <linearGradient id="azureDepth" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1600" cy="200" r="450" fill="#fde047" opacity="0.45" filter="url(#softGlow)" />
  <circle cx="300" cy="900" r="500" fill="#ec4899" opacity="0.3" filter="url(#softGlow)" />

  <!-- Organic Wave Curves -->
  <path d="M-100,600 C300,300 700,900 1200,500 C1600,200 1800,400 2100,300 L2100,1200 L-100,1200 Z" fill="url(#azureDepth)" opacity="0.85" />
  
  <path d="M-100,750 C400,550 800,1050 1300,650 C1700,350 1850,550 2100,450 L2100,1200 L-100,1200 Z" fill="url(#amberWave)" opacity="0.75" />

  <path d="M-50,450 C450,200 850,750 1350,400 C1750,150 1900,300 2050,200 L2050,1200 L-50,1200 Z" fill="url(#cyanRibbon)" opacity="0.65" />

  <!-- Subtle Horizon Specular Highlight -->
  <path d="M0,0 Q960,300 1920,0 L1920,1080 L0,1080 Z" fill="#ffffff" opacity="0.06" />
</svg>
