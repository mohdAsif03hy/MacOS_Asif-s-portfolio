<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/macbook.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SEO Meta Tags -->
    <title>Mohd Asif | Frontend Developer & UI Engineer</title>
    <meta
      name="description"
      content="Mohd Asif - Frontend Developer & UI Engineer portfolio. Interactive macOS desktop experience featuring modern web apps, projects, live GitHub activity, LeetCode stats, and technical skills."
    />
    <meta name="keywords" content="Mohd Asif, Frontend Developer, React Developer, Tailwind CSS, macOS Portfolio, Web Developer, Portfolio" />
    <meta name="author" content="Mohd Asif" />
    <link rel="canonical" href="https://mohdasif.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mohdasif.dev/" />
    <meta property="og:title" content="Mohd Asif | Frontend Developer & UI Engineer" />
    <meta
      property="og:description"
      content="Interactive macOS desktop portfolio showcasing projects, live GitHub activity, LeetCode stats, and responsive web apps."
    />
    <meta property="og:image" content="/images/wallpaper.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohd Asif | Frontend Developer & UI Engineer" />
    <meta
      name="twitter:description"
      content="Interactive macOS desktop portfolio showcasing projects, live GitHub activity, LeetCode stats, and responsive web apps."
    />
    <meta name="twitter:image" content="/images/wallpaper.png" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohd Asif",
        "jobTitle": "Frontend Developer",
        "url": "https://mohdasif.dev/",
        "sameAs": [
          "https://github.com/mohdAsif03hy",
          "https://www.linkedin.com/in/mohd-asif-14a86138b/",
          "https://leetcode.com/u/rk12SuClSa/"
        ],
        "knowsAbout": ["React.js", "JavaScript", "Tailwind CSS", "Node.js", "Web Development"]
      }
    </script>

    <!-- Preconnect & Non-blocking External Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Georama:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Georama:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      />
    </noscript>

    <!-- Preload Critical Lightweight Wallpaper Asset -->
    <link rel="preload" as="image" href="/images/wallpaper.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
